[project]
name = "student-success-early-warning"
version = "0.1.0"
description = "Weekly early-warning model for students at risk of failing or withdrawing, built on OULAD."
authors = [{ name = "Reju Sam John" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/early_warning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
